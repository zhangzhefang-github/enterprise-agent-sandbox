name: test

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 uv 和 Python 3.12
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.7.3"
          python-version: "3.12"

      - name: 按锁文件安装依赖
        run: uv sync --frozen

      - name: 运行测试
        run: uv run pytest -q
