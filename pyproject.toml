[project]
name = "enterprise-agent-sandbox"
version = "0.1.0"
description = "可重复的企业级 Agent 业务执行评测环境（第一期：P2P）"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enterprise_agent_sandbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
